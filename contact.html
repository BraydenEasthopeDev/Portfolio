    <!-- Styles -->
    <link rel="stylesheet" href="Styles.css" />
    <script src="https://kit.fontawesome.com/c542587bb4.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container container">
            <input type="checkbox" id="nav-toggle" />
            <div class="hamburger-lines">
                <span class="line line1"></span>
                <span class="line line2"></span>
                <span class="line line3"></span>
            </div>

            <div class="logo">
                <a href="index.html">BRAYDEN EASHTOPE</a>
            </div>

            <ul class="menu-items">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="projects.html">PORTFOLIO</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <!-- CONTACT HERO -->
        <section class="contact-hero">
            <div class="container">
                <h1>Contact Me</h1>
                <p>If you’d like to get in touch, fill out the form below and I’ll get back to you soon.</p>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-section">
            <div class="container">
                <form action="https://formspree.io/f/xjklbeje" method="POST" class="contact-form">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" name="name" required>
                    </div>

                    <div class="form-group">
                        <label>Your Email</label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer2">
            <div class="footer-logo">

                    <a href="contact.html">Contact</a>
                </p>
            </div>

            <div class="socials">
                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="mailto:youremail@example.com"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
